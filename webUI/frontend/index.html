  <section class="jobListPart">

      <label for="jobUpload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-upload" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg><span>Click to upload gerber</span></label>

  <!-- Mapa importu: prekladá holé nazvy ("three") na soubory v projektu.
       STLLoader.js uvnitr importuje z 'three', takze bez ni by se nenacetl.
       Knihovna je stazena do vendor/, ne z CDN - RPi u frezky nemusi mit
       konektivitu ven a pak by zustalo prazdne platno. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>

  <script type="module" src="./script.js"></script>
