<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 21px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 12.5px; fill: #6b7280; }
    .th { font-size: 12px; font-weight: 700; fill: #111827; }
    .td { font-size: 12px; fill: #374151; }
    .mono { font-size: 11.5px; fill: #374151; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .h { font-size: 14px; font-weight: 700; }
    .txt { font-size: 12px; fill: #4b5563; }
    .arr { stroke: #6b7280; stroke-width: 1.7; fill: none; }
    .warnh { font-size: 13px; font-weight: 700; fill: #b45309; }
    .warn { font-size: 12px; fill: #78350f; }
  </style>
  <defs>
    <marker id="t" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="900" height="660" fill="#ffffff"/>
  <text class="title" x="36" y="40">Who owns which piece of state</text>
  <text class="subtitle" x="36" y="61">Everything has exactly one owner — except "homed", which deliberately lives in two places.</text>

  <!-- table -->
  <rect x="36" y="84" width="828" height="30" fill="#f3f4f6"/>
  <text class="th" x="50" y="104">State</text>
  <text class="th" x="290" y="104">Owner</text>
  <text class="th" x="530" y="104">Note</text>

  <rect x="36" y="114" width="828" height="30" fill="#ffffff"/>
  <text class="td" x="50" y="134">position X, Y, Z</text>
  <text class="mono" x="290" y="134">Nano — myToolHead</text>
  <text class="td" x="530" y="134">everyone else only mirrors it from reports</text>

  <rect x="36" y="144" width="828" height="30" fill="#fffbeb"/>
  <text class="td" x="50" y="164">homed</text>
  <text class="mono" x="290" y="164">Nano AND nanoComm</text>
  <text class="td" x="530" y="164">two independent flags, see below</text>

  <rect x="36" y="174" width="828" height="30" fill="#ffffff"/>
  <text class="td" x="50" y="194">latest report</text>
  <text class="mono" x="290" y="194">backend — currentReport</text>
  <text class="td" x="530" y="194">the frontend polls it, it is never pushed</text>

  <rect x="36" y="204" width="828" height="30" fill="#f9fafb"/>
  <text class="td" x="50" y="224">job list</text>
  <text class="mono" x="290" y="224">SQLite</text>
  <text class="td" x="530" y="224">"printed" says the G-code already exists</text>

  <rect x="36" y="234" width="828" height="30" fill="#ffffff"/>
  <text class="td" x="50" y="254">paused job</text>
  <text class="mono" x="290" y="254">nanoComm</text>
  <text class="td" x="530" y="254">gcodePathRemebered + rememberedChar</text>

  <line x1="36" y1="114" x2="864" y2="114" stroke="#d1d5db"/>
  <line x1="36" y1="264" x2="864" y2="264" stroke="#d1d5db"/>

  <!-- two flags -->
  <text class="h" x="36" y="300">The two homed flags</text>

  <rect x="36" y="314" width="400" height="190" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.7"/>
  <text class="h" x="56" y="340" fill="#b45309">nanoComm :: communicator.homed</text>
  <text class="mono" x="56" y="366">false  on construction</text>
  <text class="mono" x="56" y="388">true   when cmd 2 or cmd 4 is sent</text>
  <text class="mono" x="56" y="410">never goes back to false</text>
  <text class="txt" x="56" y="440">Purpose: refuse a jog before it costs a</text>
  <text class="txt" x="56" y="458">UART round-trip. Answers with</text>
  <text class="mono" x="56" y="478">nanoReport(1, 3)</text>
  <text class="txt" x="56" y="496">and nothing reaches the serial port.</text>

  <rect x="464" y="314" width="400" height="190" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.7"/>
  <text class="h" x="484" y="340" fill="#047857">Nano :: myCalib.homed</text>
  <text class="mono" x="484" y="366">false  at power-on</text>
  <text class="mono" x="484" y="388">true   at the end of home()</text>
  <text class="mono" x="484" y="410">false  in interuptX/Y/Z on any hit</text>
  <text class="txt" x="484" y="440">Purpose: decide whether the coordinates</text>
  <text class="txt" x="484" y="458">can still be trusted. When they cannot,</text>
  <text class="txt" x="484" y="478">moves report error 7 and the operator</text>
  <text class="txt" x="484" y="496">is told to re-home.</text>

  <path class="arr" d="M300,514 L300,548" marker-end="url(#t)"/>
  <path class="arr" d="M620,514 L620,548" marker-end="url(#t)"/>

  <!-- consequence -->
  <rect x="36" y="548" width="828" height="88" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="warnh" x="56" y="572" fill="#b91c1c">This is two-stage protection, not double protection</text>
  <text class="warn" x="56" y="594" fill="#7f1d1d">Nothing synchronises the two flags. When the machine runs into an endstop mid-job, the Nano drops its flag and starts reporting error 7,</text>
  <text class="warn" x="56" y="612" fill="#7f1d1d">but nanoComm still believes the machine is homed and keeps forwarding moves. nanoComm only ever catches a cold start; the Nano</text>
  <text class="warn" x="56" y="630" fill="#7f1d1d">catches the loss of reference. Clearing nanoComm's flag when error 7 arrives would close the gap.</text>
</svg>
