<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 21px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 12.5px; fill: #6b7280; }
    .h { font-size: 15px; font-weight: 700; }
    .mono { font-size: 12px; fill: #374151; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .txt { font-size: 12px; fill: #4b5563; }
    .ok { font-size: 12.5px; font-weight: 700; fill: #047857; }
    .no { font-size: 12.5px; font-weight: 700; fill: #b91c1c; }
    .th { font-size: 12px; font-weight: 700; fill: #111827; }
  </style>

  <rect width="880" height="660" fill="#ffffff"/>
  <text class="title" x="36" y="40">Why the spindle sits on D11</text>
  <text class="subtitle" x="36" y="61">The ATmega328P has three timers and only six PWM pins. Five of the six are spoken for.</text>

  <!-- timers -->
  <rect x="36" y="88" width="256" height="150" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.7"/>
  <text class="h" x="56" y="116" fill="#b91c1c">Timer0</text>
  <text class="mono" x="56" y="140">pins D5, D6</text>
  <text class="txt" x="56" y="164">Drives millis() and delay().</text>
  <text class="txt" x="56" y="183">Changing its prescaler breaks</text>
  <text class="txt" x="56" y="202">every timing call in the sketch.</text>
  <text class="no" x="56" y="226">unusable</text>

  <rect x="312" y="88" width="256" height="150" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.7"/>
  <text class="h" x="332" y="116" fill="#b91c1c">Timer1</text>
  <text class="mono" x="332" y="140">pins D9, D10</text>
  <text class="txt" x="332" y="164">The step generator itself:</text>
  <text class="mono" x="332" y="183">ISR(TIMER1_COMPA_vect)</text>
  <text class="txt" x="332" y="202">All motion depends on it.</text>
  <text class="no" x="332" y="226">unusable</text>

  <rect x="588" y="88" width="256" height="150" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.7"/>
  <text class="h" x="608" y="116" fill="#047857">Timer2</text>
  <text class="mono" x="608" y="140">pins D3, D11</text>
  <text class="txt" x="608" y="164">The firmware never uses it for</text>
  <text class="txt" x="608" y="183">anything else, so its prescaler</text>
  <text class="txt" x="608" y="202">is ours to set.</text>
  <text class="ok" x="608" y="226">free</text>

  <!-- elimination -->
  <text class="th" x="36" y="284">Six PWM-capable pins, one survivor</text>
  <g>
    <rect x="36" y="298" width="130" height="42" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
    <text class="mono" x="52" y="316">D5, D6</text>
    <text class="no" x="52" y="333">Timer0</text>

    <rect x="178" y="298" width="130" height="42" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
    <text class="mono" x="194" y="316">D9, D10</text>
    <text class="no" x="194" y="333">Timer1</text>

    <rect x="320" y="298" width="150" height="42" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
    <text class="mono" x="336" y="316">D3</text>
    <text class="no" x="336" y="333">taken by ENABLE</text>

    <rect x="482" y="298" width="150" height="42" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.8"/>
    <text class="mono" x="498" y="316">D11</text>
    <text class="ok" x="498" y="333">SPINDL_PIN</text>
  </g>

  <!-- prescaler -->
  <text class="th" x="36" y="392">Timer2 prescaler — set once in initialate()</text>
  <rect x="36" y="404" width="500" height="34" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/>
  <text class="mono" x="52" y="426">TCCR2B = (TCCR2B &amp; 0b11111000) | 0b001;</text>

  <g>
    <rect x="36" y="452" width="500" height="30" fill="#f3f4f6"/>
    <text class="th" x="52" y="472">bits</text>
    <text class="th" x="180" y="472">divider</text>
    <text class="th" x="300" y="472">frequency</text>
    <text class="th" x="440" y="472">note</text>

    <line x1="36" y1="482" x2="536" y2="482" stroke="#d1d5db"/>
    <text class="mono" x="52" y="504">0b001</text><text class="mono" x="180" y="504">1</text>
    <text class="mono" x="300" y="504">31372 Hz</text><text class="ok" x="440" y="504">in use</text>

    <line x1="36" y1="514" x2="536" y2="514" stroke="#e5e7eb"/>
    <text class="mono" x="52" y="536">0b010</text><text class="mono" x="180" y="536">8</text>
    <text class="mono" x="300" y="536">3922 Hz</text><text class="txt" x="440" y="536">audible</text>

    <line x1="36" y1="546" x2="536" y2="546" stroke="#e5e7eb"/>
    <text class="mono" x="52" y="568">0b011</text><text class="mono" x="180" y="568">32</text>
    <text class="mono" x="300" y="568">980 Hz</text><text class="txt" x="440" y="568">audible</text>

    <line x1="36" y1="578" x2="536" y2="578" stroke="#e5e7eb"/>
    <text class="mono" x="52" y="600">0b100</text><text class="mono" x="180" y="600">64</text>
    <text class="mono" x="300" y="600">490 Hz</text><text class="txt" x="440" y="600">default, whines</text>
  </g>

  <!-- note -->
  <rect x="560" y="392" width="284" height="216" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text class="h" x="578" y="418" fill="#b45309">Why the line survives</text>
  <text class="txt" x="578" y="442" fill="#78350f">analogWrite() only touches TCCR2A</text>
  <text class="txt" x="578" y="460" fill="#78350f">and OCR2A. It never writes the</text>
  <text class="txt" x="578" y="478" fill="#78350f">prescaler in TCCR2B, so setting it</text>
  <text class="txt" x="578" y="496" fill="#78350f">once at startup holds forever.</text>
  <text class="h" x="578" y="530" fill="#b45309">During milling there is no PWM</text>
  <text class="txt" x="578" y="554" fill="#78350f">S20000 maps to duty exactly 255,</text>
  <text class="txt" x="578" y="572" fill="#78350f">so controlSpindl() falls through to</text>
  <text class="txt" x="578" y="590" fill="#78350f">digitalWrite(HIGH) — solid on.</text>
</svg>
