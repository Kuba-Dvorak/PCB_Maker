<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" width="860" height="700" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 21px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 12.5px; fill: #6b7280; }
    .lbl { font-size: 15.5px; font-weight: 700; }
    .note { font-size: 11.5px; fill: #4b5563; }
    .edge { stroke: #9ca3af; stroke-width: 2.2; fill: none; }
    .edgelbl { font-size: 12px; font-weight: 600; fill: #374151; }
    .edgesub { font-size: 11px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="860" height="700" fill="#ffffff"/>
  <text class="title" x="40" y="42">System architecture</text>
  <text class="subtitle" x="40" y="63">Each layer talks only to its neighbours. The browser never sees UART, the Nano never sees JSON.</text>

  <!-- frontend -->
  <rect x="150" y="90" width="440" height="74" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text class="lbl" x="172" y="120" fill="#1d4ed8">Frontend (browser)</text>
  <text class="note" x="172" y="142">Static HTML / CSS / JS, no build step, polls for telemetry</text>

  <path class="edge" d="M370,164 L370,214" marker-end="url(#a)"/>
  <text class="edgelbl" x="610" y="184">HTTP, port 3300</text>
  <text class="edgesub" x="610" y="200">JSON request / response</text>

  <!-- backend -->
  <rect x="150" y="214" width="440" height="74" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text class="lbl" x="172" y="244" fill="#6d28d9">Backend (Node + Express)</text>
  <text class="note" x="172" y="266">Job database, Gerber upload, runs pcb2gcode</text>

  <path class="edge" d="M300,288 L300,338" marker-end="url(#a)"/>
  <path class="edge" d="M440,288 L440,338" marker-end="url(#a)"/>
  <text class="edgelbl" x="610" y="304">TCP 5000 — commands + reports</text>
  <text class="edgelbl" x="610" y="322">TCP 5001 — emergency</text>
  <text class="edgesub" x="610" y="338">messages prefixed with $</text>

  <!-- nanoComm -->
  <rect x="150" y="338" width="440" height="74" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text class="lbl" x="172" y="368" fill="#b45309">nanoComm (C++ daemon)</text>
  <text class="note" x="172" y="390">Decodes G-code, the only program that touches the serial port</text>

  <path class="edge" d="M370,412 L370,462" marker-end="url(#a)"/>
  <text class="edgelbl" x="610" y="432">UART 115200 8-N-1</text>
  <text class="edgesub" x="610" y="448">$status;error;x;y;z;speed;spindle;endstops;\n</text>

  <!-- nano -->
  <rect x="150" y="462" width="440" height="74" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text class="lbl" x="172" y="492" fill="#047857">Arduino Nano (firmware)</text>
  <text class="note" x="172" y="514">Owns the position, generates steps from Timer1</text>

  <path class="edge" d="M370,536 L370,586" marker-end="url(#a)"/>
  <text class="edgelbl" x="610" y="562">STEP / DIR + PWM</text>

  <!-- hardware -->
  <rect x="150" y="586" width="440" height="74" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text class="lbl" x="172" y="616" fill="#b91c1c">Steppers, endstops, spindle</text>
  <text class="note" x="172" y="638">3x NEMA 17, 6 limit switches, RS-550 through a MOSFET module</text>

  <!-- report path back -->
  <path class="edge" d="M120,624 L120,127" marker-end="url(#a)" stroke-dasharray="6 4"/>
  <text class="edgelbl" x="34" y="360" transform="rotate(-90 34 360)">reports travel back up</text>
</svg>
