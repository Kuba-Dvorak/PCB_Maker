<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 21px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 12.5px; fill: #6b7280; }
    .h { font-size: 14px; font-weight: 700; fill: #111827; }
    .mono { font-size: 12px; fill: #374151; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .monob { font-size: 12.5px; font-weight: 700; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .txt { font-size: 12px; fill: #4b5563; }
    .lvl { stroke-width: 1.7; stroke-dasharray: 7 4; fill: none; }
    .ruler { stroke: #6b7280; stroke-width: 1.8; }
  </style>
  <defs>
    <marker id="z" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#6b7280"/>
    </marker>
    <marker id="zb" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <path d="M9,0 L0,3.5 L9,7 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#ffffff"/>
  <text class="title" x="36" y="40">The Z axis is shifted upwards on purpose</text>
  <text class="subtitle" x="36" y="61">The firmware clamps Z to 0…25 mm, so the copper surface is not Z 0 — it is Z 2.0.</text>

  <!-- ruler -->
  <line class="ruler" x1="140" y1="150" x2="140" y2="548"/>
  <text class="mono" x="132" y="146" text-anchor="end">Z</text>

  <!-- levels -->
  <line class="lvl" x1="140" y1="176" x2="600" y2="176" stroke="#8b5cf6"/>
  <text class="monob" x="130" y="180" text-anchor="end" fill="#6d28d9">10.00</text>
  <text class="txt" x="610" y="174">zchange — tool change height</text>

  <line class="lvl" x1="140" y1="395" x2="600" y2="395" stroke="#3b82f6"/>
  <text class="monob" x="130" y="399" text-anchor="end" fill="#1d4ed8">4.00</text>
  <text class="txt" x="610" y="393">zsafe — rapid moves happen here</text>

  <line class="lvl" x1="140" y1="467" x2="600" y2="467" stroke="#b45309"/>
  <text class="monob" x="130" y="471" text-anchor="end" fill="#b45309">2.00</text>
  <text class="txt" x="610" y="458">copper surface — the reference plane,</text>
  <text class="txt" x="610" y="474">never written into the G-code itself</text>

  <line class="lvl" x1="140" y1="474" x2="600" y2="474" stroke="#dc2626"/>
  <text class="monob" x="130" y="492" text-anchor="end" fill="#b91c1c">1.95</text>
  <text class="txt" x="610" y="496">zwork — 0.05 mm below the surface</text>

  <text class="monob" x="130" y="552" text-anchor="end" fill="#374151">0.00</text>

  <!-- board -->
  <rect x="180" y="474" width="420" height="66" fill="#166534" opacity="0.18"/>
  <rect x="180" y="467" width="420" height="8" fill="#b87333"/>
  <text class="txt" x="192" y="516">FR4 substrate</text>
  <text class="txt" x="392" y="516">copper — thickness exaggerated</text>

  <!-- tool -->
  <rect x="352" y="300" width="18" height="80" rx="3" fill="#6b7280"/>
  <path d="M352,380 L370,380 L364,395 L358,395 Z" fill="#374151"/>
  <text class="txt" x="382" y="330">tool parked at zsafe</text>

  <!-- clamp range -->
  <line class="ruler" x1="92" y1="150" x2="92" y2="548" marker-start="url(#zb)" marker-end="url(#z)"/>
  <text class="txt" x="70" y="360" text-anchor="middle" transform="rotate(-90 70 360)">firmware clamp 0 … 25 mm</text>

  <!-- explanation -->
  <rect x="610" y="120" width="256" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="h" x="628" y="145" fill="#b91c1c">Why not just use negative Z?</text>
  <text class="txt" x="628" y="168" fill="#7f1d1d">pcb2gcode normally cuts below</text>
  <text class="txt" x="628" y="186" fill="#7f1d1d">zero (zwork = -0.05). But the</text>
  <text class="txt" x="628" y="204" fill="#7f1d1d">firmware clamps anything negative</text>
  <text class="txt" x="628" y="222" fill="#7f1d1d">to 0 and raises error 6, so every</text>
  <text class="txt" x="628" y="240" fill="#7f1d1d">cut would ride across the surface</text>
  <text class="txt" x="628" y="258" fill="#7f1d1d">and mill precisely nothing.</text>

  <rect x="610" y="530" width="256" height="94" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text class="h" x="628" y="554" fill="#b45309">Cutting deeper means going down</text>
  <text class="txt" x="628" y="576" fill="#78350f">1.95 → 1.90 is 0.10 mm deep.</text>
  <text class="txt" x="628" y="596" fill="#78350f">pcb2gcode warns "engraving depth</text>
  <text class="txt" x="628" y="614" fill="#78350f">is greater than zero" — expected.</text>
</svg>
